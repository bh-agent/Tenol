<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00A86B" />
  <title>오프라인 - 테놀</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #171717;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 20px;
      background: #00A86B;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 40px;
      font-weight: 700;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #171717;
    }
    p {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    button {
      background: #00A86B;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #008f5a;
    }
    .wifi-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="1" x2="23" y2="23" />
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
    <line x1="12" y1="20" x2="12.01" y2="20" />
  </svg>
  <h1>인터넷 연결이 없습니다</h1>
  <p>연결되면 <b>자동으로 돌아갑니다</b>.<br />잠시만 기다리시거나 아래를 눌러주세요.</p>
  <button id="retry">다시 시도</button>
  <script>
    // 네이티브 앱: 이 페이지는 로컬 errorPath이므로 reload()는 같은 오프라인 화면만 다시 뜬다.
    // 실제 앱(원격 URL)으로 다시 진입해야 복구된다. 웹에서는 현재 페이지를 새로고침.
    //
    // 이 화면은 대부분 "앱을 백그라운드에서 복귀시킨 직후 OS 네트워크가 아직
    // 깨어나기 전에 로드가 실패"해서 뜬다(진짜 오프라인이 아님). 그래서 서버에
    // 주기적으로 핑을 보내 연결이 확인되는 즉시 자동으로 앱에 복귀한다.
    (function () {
      var APP_URL = 'https://tenol-one.vercel.app/clubs';
      var isLocal = location.protocol === 'capacitor:' || location.protocol === 'file:' || location.hostname === 'localhost';
      var returning = false;

      function goApp() {
        if (returning) return;
        returning = true;
        if (isLocal) location.href = APP_URL;
        else location.reload();
      }

      function ping() {
        if (returning) return;
        // no-cors: CORS 실패와 무관하게 "네트워크 도달 여부"만 확인
        fetch('https://tenol-one.vercel.app/offline.html', { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
          .then(goApp)
          .catch(function () {});
      }

      document.getElementById('retry').addEventListener('click', goApp);
      window.addEventListener('online', ping);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') ping();
      });
      // 1.5초 간격 폴링 — 복귀 직후 네트워크가 깨어나면 수 초 내 자동 복구
      setInterval(ping, 1500);
      ping();
    })();
  </script>
</body>
</html>
